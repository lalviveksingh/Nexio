name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Nexio-1
        working-directory: Nexio-1
        run: npm ci --no-audit --no-fund
      - name: Build Nexio-1 (static)
        working-directory: Nexio-1
        run: npm run build:pages

      - name: Install Nexio-2
        working-directory: Nexio-2
        run: npm ci --no-audit --no-fund
      - name: Build Nexio-2 (static)
        working-directory: Nexio-2
        run: npm run build:pages

      - name: Install Nexio-3
        working-directory: Nexio-3
        run: npm ci --no-audit --no-fund
      - name: Build Nexio-3 (static)
        working-directory: Nexio-3
        run: npm run build:pages

      - name: Assemble site
        run: |
          mkdir -p site
          for i in 1 2 3; do cp -r "Nexio-$i/out" "site/Nexio-$i"; done
          cp pages-landing/index.html site/index.html
          touch site/.nojekyll

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
